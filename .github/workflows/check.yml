name: Check

on:
  push:
    paths:
      - "apps/**"
      - "packages/**"
      - ".github/workflows/check.yml"
      - "eslint.config.js"
      - ".gitignore"
      - ".prettierignore"
      - "nx.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - ".github/workflows/check.yml"
      - "eslint.config.js"
      - ".gitignore"
      - ".prettierignore"
      - "nx.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
