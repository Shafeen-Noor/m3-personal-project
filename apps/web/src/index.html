<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2eee6" />
    <title>Weekend Planner</title>
    <style>
      :root {
        color: #202c2a;
        background: #f2eee6;
        font-family: Arial, sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(ellipse at 8% 5%, #e2e9dd 0, transparent 36%), #f2eee6;
      }
      .shell {
        width: min(1120px, calc(100% - 40px));
        margin: 0 auto;
        padding: 28px 0 56px;
      }
      .masthead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 4px 22px;
        border-bottom: 1px solid #d9d9ce;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        color: inherit;
        font-family: Georgia, serif;
        font-size: 1.15rem;
        font-weight: bold;
        text-decoration: none;
      }
      .brand-mark {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        color: #fff;
        background: #315c50;
        border-radius: 50% 50% 50% 12px;
        font-family: Arial, sans-serif;
        font-size: 0.8rem;
      }
      .header-note,
      .eyebrow {
        color: #6f7868;
        font-size: 0.72rem;
        font-weight: bold;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      main {
        padding-top: 28px;
      }
      .welcome,
      .question-card,
      .result-card {
        padding: clamp(24px, 5vw, 54px);
        background: #fffefa;
        border: 1px solid #e1ded3;
        border-radius: 24px;
        box-shadow: 0 22px 60px #2636300c;
      }
      .welcome {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(220px, 0.7fr);
        align-items: center;
        gap: 36px;
        min-height: 390px;
      }
      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }
      h1,
      h2 {
        margin-bottom: 12px;
        font-family: Georgia, serif;
        font-weight: 500;
        letter-spacing: -0.035em;
      }
      h1 {
        max-width: 540px;
        font-size: clamp(2.4rem, 5vw, 4.2rem);
        line-height: 1.04;
      }
      h2 {
        font-size: clamp(1.8rem, 3vw, 2.7rem);
      }
      h3 {
        margin-bottom: 8px;
        font-size: 1.05rem;
      }
      p {
        color: #67716b;
        line-height: 1.6;
      }
      .welcome-copy > p:not(.eyebrow) {
        max-width: 440px;
        margin-bottom: 24px;
      }
      .welcome-art {
        position: relative;
        min-height: 250px;
        overflow: hidden;
        background: #dfe8dc;
        border-radius: 48% 48% 18px 18px;
      }
      .sun {
        position: absolute;
        top: 32px;
        right: 36px;
        width: 76px;
        height: 76px;
        background: #e8a96f;
        border-radius: 50%;
      }
      .hill {
        position: absolute;
        right: -8%;
        bottom: -25%;
        width: 120%;
        height: 70%;
        background: #79927b;
        border-radius: 50% 50% 0 0;
        transform: rotate(-8deg);
      }
      .hill.back {
        right: 28%;
        bottom: -32%;
        width: 95%;
        background: #abc0a0;
        transform: rotate(13deg);
      }
      .art-note {
        position: absolute;
        bottom: 22px;
        left: 22px;
        z-index: 1;
        padding: 10px 13px;
        color: #263b32;
        background: #fffefaeb;
        border-radius: 999px;
        font-size: 0.78rem;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid #d58b56;
        outline-offset: 3px;
      }
      .primary,
      .secondary,
      .day-tab,
      .small-button {
        border-radius: 999px;
      }
      .primary {
        padding: 14px 21px;
        color: #fff;
        background: #315c50;
        border: 1px solid #315c50;
        font-weight: bold;
      }
      .primary:hover {
        background: #24473d;
      }
      .secondary {
        padding: 12px 17px;
        color: #315c50;
        background: transparent;
        border: 1px solid #cbd4c9;
        font-weight: bold;
      }
      .question-card {
        max-width: 760px;
        margin: 0 auto;
      }
      .progress {
        height: 7px;
        margin: 22px 0 12px;
        overflow: hidden;
        background: #ecece4;
        border-radius: 999px;
      }
      .progress span {
        display: block;
        height: 100%;
        background: #d58b56;
        border-radius: inherit;
        transition: width 0.2s;
      }
      .options {
        display: grid;
        gap: 11px;
        margin-top: 26px;
      }
      .choice {
        padding: 15px 17px;
        color: #263631;
        background: #f7f6f0;
        border: 1px solid #e3e3d9;
        border-radius: 14px;
        text-align: left;
      }
      .choice:hover {
        background: #edf2e9;
        border-color: #9cad9d;
      }
      .number-row {
        display: flex;
        gap: 10px;
      }
      .number-row .choice {
        flex: 1;
        text-align: center;
      }
      .muted {
        color: #7b847b;
        font-size: 0.9rem;
      }
      .result-card {
        padding: clamp(22px, 3vw, 36px);
      }
      .result-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 26px;
      }
      .result-heading p {
        margin-bottom: 0;
      }
      .result-layout {
        display: grid;
        grid-template-columns: minmax(0, 1.55fr) minmax(250px, 0.8fr);
        gap: 24px;
        align-items: start;
      }
      .itinerary,
      .editor,
      .plan-summary {
        padding: 22px;
        background: #f8f7f1;
        border: 1px solid #e5e3d9;
        border-radius: 18px;
      }
      .section-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .day-tabs {
        display: flex;
        gap: 8px;
        margin: 14px 0 18px;
      }
      .day-tab {
        padding: 8px 12px;
        color: #59645d;
        background: transparent;
        border: 1px solid #dce0d7;
        font-size: 0.82rem;
      }
      .day-tab[aria-pressed="true"] {
        color: #fff;
        background: #315c50;
        border-color: #315c50;
      }
      .schedule {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .activity {
        display: grid;
        grid-template-columns: 64px minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        padding: 13px;
        background: #fffefa;
        border: 1px solid #ece9df;
        border-radius: 14px;
      }
      .activity-time {
        color: #315c50;
        font-size: 0.84rem;
        font-weight: bold;
      }
      .activity-day {
        display: block;
        margin-bottom: 3px;
        color: #899087;
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .activity-name {
        margin: 0;
        color: #25342f;
        font-weight: bold;
      }
      .activity-actions {
        display: flex;
        gap: 5px;
      }
      .small-button {
        padding: 7px 9px;
        color: #52635a;
        background: transparent;
        border: 1px solid transparent;
        font-size: 0.76rem;
      }
      .small-button:hover {
        background: #f1f1e9;
        border-color: #dadfd4;
      }
      .small-button.remove {
        color: #a35445;
      }
      .empty-state {
        padding: 24px 8px;
        color: #7b847b;
        text-align: center;
      }
      .side-column {
        display: grid;
        gap: 14px;
      }
      .editor h3 {
        margin-bottom: 16px;
      }
      .field {
        display: grid;
        gap: 7px;
        margin-bottom: 13px;
      }
      .field label {
        color: #647067;
        font-size: 0.8rem;
        font-weight: bold;
      }
      .field input,
      .field select {
        width: 100%;
        padding: 11px 12px;
        color: #25342f;
        background: #fffefa;
        border: 1px solid #dcded5;
        border-radius: 10px;
      }
      .editor-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 18px;
      }
      .editor-actions .primary {
        flex: 1;
        padding: 11px 14px;
        font-size: 0.9rem;
      }
      .summary-line {
        display: flex;
        justify-content: space-between;
        padding: 9px 0;
        color: #68746b;
        border-bottom: 1px solid #e6e4da;
        font-size: 0.9rem;
      }
      .summary-line:last-child {
        padding-bottom: 0;
        border-bottom: 0;
      }
      .summary-line strong {
        color: #263831;
      }
      .status-message {
        min-height: 1.3em;
        margin: 8px 0 0;
        color: #a35445;
        font-size: 0.82rem;
      }
      .footer-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 20px;
      }
      @media (max-width: 760px) {
        .welcome {
          grid-template-columns: 1fr;
        }
        .welcome-art {
          min-height: 190px;
        }
        .result-layout {
          grid-template-columns: 1fr;
        }
        .result-heading {
          align-items: start;
          flex-direction: column;
        }
      }
      @media (max-width: 520px) {
        .shell {
          width: min(100% - 24px, 1120px);
          padding-top: 16px;
        }
        .header-note {
          max-width: 110px;
          text-align: right;
          line-height: 1.4;
        }
        .welcome,
        .question-card,
        .result-card {
          border-radius: 18px;
        }
        .activity {
          grid-template-columns: 54px minmax(0, 1fr);
        }
        .activity-actions {
          grid-column: 2;
        }
        .footer-row {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="masthead">
        <a class="brand" href="/">
          <span class="brand-mark">WP</span>
          <span>Weekend Planner</span>
        </a>
        <span class="header-note">Make room for your weekend</span>
      </header>
      <main>
        <section id="app" aria-live="polite">
          <div class="welcome">
            <div class="welcome-copy">
              <p class="eyebrow">A little room for the weekend</p>
              <h1>Make space for a good weekend.</h1>
              <p>
                Start with a few preferences, then shape the plan around what
                you actually want to do.
              </p>
              <button class="primary" id="start">Build a starting plan</button>
            </div>
            <div class="welcome-art" aria-hidden="true">
              <span class="sun"></span>
              <span class="hill back"></span>
              <span class="hill"></span>
              <span class="art-note">Saturday · Sunday · Your pace</span>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
